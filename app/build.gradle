plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.zombi.jarvismobile'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.zombi.jarvismobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.6.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
