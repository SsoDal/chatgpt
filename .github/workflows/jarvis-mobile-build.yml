name: JARVIS Mobile APK

on:
  push:
    branches: [jarvis-mobile-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build signed release APK
        run: gradle --no-daemon clean assembleRelease
      - name: Verify APK and signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          ls -lh "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -20
      - name: Prepare artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/JARVIS_Mobile_2.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS_Mobile_2_APK
          path: out/JARVIS_Mobile_2.apk
          if-no-files-found: error
          retention-days: 7
